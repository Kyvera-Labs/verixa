name: Coverage Report
description: >-
  Formats merged Vitest workspace coverage and ratchet gate output into GitHub
  Actions check annotations, job step summaries, and an optional sticky PR
  comment.

inputs:
  summary-path:
    description: Path to the merged coverage-summary.json file.
    required: false
    default: coverage/coverage-summary.json
  ratchet-markdown-path:
    description: Path to the markdown report produced by pnpm coverage:ratchet.
    required: false
    default: coverage/ratchet-summary.md
  post-pr-comment:
    description: Whether to post or update a sticky coverage summary comment on pull requests.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Emit coverage summary and check annotations
      shell: bash
      env:
        SUMMARY_PATH: ${{ inputs.summary-path }}
        RATCHET_MD_PATH: ${{ inputs.ratchet-markdown-path }}
      run: |
        set -eu
        if [ -f "$RATCHET_MD_PATH" ]; then
          cat "$RATCHET_MD_PATH" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -f "$SUMMARY_PATH" ]; then
          node -e '
            const fs = require("node:fs");
            const summary = JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH, "utf8"));
            const total = summary.total || {};
            const fmt = (m) => (m && typeof m.pct === "number" ? `${m.pct.toFixed(2)}%` : "n/a");
            const msg = `Workspace coverage — Lines: ${fmt(total.lines)}, Statements: ${fmt(total.statements)}, Functions: ${fmt(total.functions)}, Branches: ${fmt(total.branches)}`;
            console.log(`::notice title=Coverage Summary::${msg}`);
          '
        else
          echo "::warning title=Coverage Summary::Coverage summary file not found at $SUMMARY_PATH"
        fi

    - name: Post or update PR coverage comment
      if: inputs.post-pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        RATCHET_MD_PATH: ${{ inputs.ratchet-markdown-path }}
      with:
        script: |
          const fs = require("node:fs");
          const marker = "<!-- verixa-coverage-report -->";
          const reportPath = process.env.RATCHET_MD_PATH;
          if (!fs.existsSync(reportPath)) {
            core.info(`No ratchet markdown report at ${reportPath}; skipping PR comment.`);
            return;
          }
          const body = `${marker}\n${fs.readFileSync(reportPath, "utf8")}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }
