name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Nothing in this workflow writes to the repository, comments
# on a pull request or publishes anything, so a compromised step or dependency
# gets a token that can read code that is already public and do nothing else.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Backs tests/integration/database.spec.ts (Issue 041) — a real
      # Postgres, not a mock, so "can the app actually reach a database"
      # is answered by an actual TCP-level connection, not an assumption.
      # GitHub Actions runs service containers alongside the job on the
      # same runner, reachable at localhost from job steps (this job isn't
      # itself containerized) — no networking setup needed beyond the port
      # mapping below.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verixa
          POSTGRES_PASSWORD: verixa
          POSTGRES_DB: verixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verixa -d verixa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Backs the sessions revocation deny-list integration tests (Issue 088) —
      # a real Redis, so "does revoke/isRevoke/TTL-expiry behave against the
      # actual store" is answered by the store, not a fake. Same rationale and
      # localhost reachability as the Postgres service above.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_test
      # Prisma reads DATABASE_URL for both `generate` and `migrate` (Issue
      # 042). Points at the same service container as TEST_DATABASE_URL —
      # in CI there's no separate dev database to keep migrations away from,
      # which is the whole reason the two URLs exist separately locally.
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_test
      # Database-backed tests skip themselves when no Postgres is reachable,
      # so `pnpm test` passes on a fresh clone without Docker. That's the
      # right default locally and the wrong one here: a misconfigured service
      # container would make every such test skip and still report success.
      # This flag turns "no database" into a hard failure in CI only.
      REQUIRE_DATABASE_TESTS: "1"
      # Points the sessions Redis integration tests at the service container.
      TEST_REDIS_URL: redis://localhost:6379
      # Same reasoning as REQUIRE_DATABASE_TESTS: Redis-backed tests skip
      # themselves when no Redis is reachable, which is right locally and wrong
      # here — a misconfigured service container would make them skip and still
      # report green. This turns "no Redis" into a hard failure in CI only.
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Issue 215. Runs before the install it guards, and deliberately invoked
      # as `node` rather than `pnpm run check:lockfile`: the gate has to work on
      # a tree that has never been installed, so it takes no dependencies, no
      # package-manager setup and no build. It is also the first thing to fail
      # when `pnpm-lock.yaml` is missing at all, which would otherwise surface
      # as setup-node's `cache: pnpm` complaining that it cannot find a
      # lockfile — true, but three steps downstream of the actual mistake.
      - name: Check lockfile integrity
        run: node infra/ci/check-lockfile-integrity.mjs

      # Runs before install and lint for the same reason as the lockfile gate,
      # and one more: the PolinRider payload it looks for executes during
      # install and lint, so finding it afterwards is too late.
      - name: Check for malware indicators
        run: node infra/ci/check-malware-indicators.mjs

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.53.3 lint --extends minimal apps/api/openapi/openapi.yaml

      # The Prisma client is generated, not committed (it's platform-specific
      # — see .gitignore), so it has to be generated before anything that
      # imports @verixa/database is built, typechecked, or tested. Same
      # ordering principle as the build step below, one level earlier.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Every workspace package must be built before anything that imports
      # it can be reliably linted, typechecked, or tested — see
      # docs/guides/typescript-conventions.md and docs/guides/ci-cd.md for
      # why this isn't just belt-and-suspenders: package.json "exports"
      # subpaths (unlike "main") have no fallback when the target file is
      # missing, so type-aware linting fails outright, not gracefully, on
      # an unbuilt dependency.
      - name: Build
        run: pnpm build

      # Re-sync injected workspace packages after building them.
      #
      # `injectWorkspacePackages: true` (required for `pnpm deploy`, which
      # builds the Docker image) makes pnpm *copy* some workspace packages into
      # their dependents' node_modules rather than symlinking. Which ones get
      # copied is decided by peer-dependency resolution -- @verixa/audit and
      # @verixa/stellar-anchor are copied because the Stellar SDK pulls
      # `debug`/`supports-color` peers, while @verixa/identity is symlinked.
      #
      # Those copies are made during install, when no package has a `dist` yet.
      # pnpm refreshes them before running a dependent's own script, so a
      # package that builds gets fresh copies -- but `tests` has no build
      # script, so its copies stayed empty and every integration spec failed
      # with "Failed to resolve entry for package @verixa/audit".
      #
      # Invisible locally, because a developer's node_modules has been through
      # an install *after* a build at some point. Only a clean checkout hits it.
      - name: Re-link workspace packages
        run: pnpm install --frozen-lockfile

      # Proves the migration pipeline actually works end to end against a
      # real Postgres: Prisma connects using DATABASE_URL, creates its
      # _prisma_migrations tracking table, and applies every migration in
      # order. There are no migrations yet (no models until Issue 043), so
      # today this verifies the wiring rather than any schema — which is
      # exactly what Issue 042 is for. It starts catching real regressions
      # the moment the first table lands.
      - name: Verify migrations apply to a fresh database
        run: pnpm db:migrate:deploy

      # Schema hygiene (Issue 058). `validate` catches a schema that isn't
      # legal Prisma; `format --check` keeps the file from drifting into
      # whatever each contributor's editor does.
      - name: Validate Prisma schema
        run: pnpm --filter @verixa/database run db:validate

      - name: Check Prisma schema formatting
        run: pnpm --filter @verixa/database run db:format:check

      # Migration safety & policy check (Issues 393 & 394). Verifies forward-only
      # policy (flags undocumented destructive drops) and zero-downtime compatibility
      # (flags single-step NOT NULL column additions without DEFAULTs).
      - name: Check migration safety and zero-downtime policy
        run: pnpm run check:migration-safety

      # Drift detection: does replaying every migration actually produce the
      # schema.prisma in the repo? They diverge when someone edits the schema
      # and forgets to generate a migration — the edit works locally (the
      # client is generated from schema.prisma) and then fails in production,
      # where only migrations ran. Catching it at merge is the entire point.
      #
      # Needs a scratch database to replay migrations into; the service
      # container above provides one.
      - name: Check for schema/migration drift
        env:
          SHADOW_DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_shadow
        run: |
          PGPASSWORD=verixa psql -h localhost -U verixa -d postgres -c "DROP DATABASE IF EXISTS verixa_shadow;"
          PGPASSWORD=verixa psql -h localhost -U verixa -d postgres -c "CREATE DATABASE verixa_shadow;"
          pnpm --filter @verixa/database run db:drift

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Issue 389: Environment configuration matrix sync check.
      # Verifies that docs/guides/deployment.md stays in exact sync with
      # packages/config/schema.ts so new variables are never added without
      # being classified by secret status and environment source.
      - name: Verify environment configuration matrix sync
        run: pnpm check:env-matrix

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm typecheck` is recursive over *workspace packages*, and infra/ci is
      # deliberately not one (it declares no dependencies and must never be
      # built, published, or installed as a package — see infra/ci/package.json).
      # So the tooling that decides whether a release is installable gets
      # typechecked here instead, rather than first failing in release.yml, where
      # nothing else runs before the SBOM step.
      - name: Typecheck CI tooling
        run: pnpm typecheck:ci

      # The same tests `pnpm test` runs, split into the two suites the
      # performance budget tracks (Issue 415) and timed from outside, so the
      # budget measures what a contributor waits for, not summed per-test
      # durations. Each step still fails on a failing test: `measure` passes
      # the command's exit code through. See
      # docs/guides/testing/performance-budget.md.
      - name: Test (unit, per-package suites)
        run: >
          pnpm perf:budget measure --suite unit --timings test-timings.json --
          pnpm -r --filter "!@verixa/integration-tests" run test

      - name: Test (integration)
        run: >
          pnpm perf:budget measure --suite integration --timings test-timings.json --
          pnpm --filter @verixa/integration-tests run test

      # Compares against the committed baseline and writes the duration table
      # to the job summary. Fails on a suite more than the baseline's tolerance
      # slower, or on a budgeted suite that was never timed.
      #
      # Report-only for now: the committed baseline was measured on a laptop,
      # not on this runner, so a "regression" against it means nothing yet.
      # The step still shows as failed and still writes the table. Remove
      # `continue-on-error` once infra/ci/perf-baseline.json holds figures
      # from this job (see its "source" field).
      - name: Check test duration budget
        continue-on-error: true
        run: >
          pnpm perf:budget check
          --baseline infra/ci/perf-baseline.json
          --timings test-timings.json
          --summary "$GITHUB_STEP_SUMMARY"
          --report test-duration-report.json

      # Kept even when the budget check fails: the numbers are what a
      # maintainer needs to decide between "this PR is slow" and "the baseline
      # is out of date".
      - name: Upload test duration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-duration
          path: |
            test-timings.json
            test-duration-report.json
          if-no-files-found: ignore
          retention-days: 30
      # Issue 414: Flaky test quarantine audit.
      # Scans the test suites to ensure no @quarantine tags have reached their
      # time-boxed expiration date. If a quarantined test's deadline has elapsed,
      # this step fails CI so the test must either be fixed or explicitly re-scoped.
      - name: Verify test quarantines
        run: pnpm flaky:track --scan-quarantines

      # packages/identity is the first fully-built bounded context, and
      # carries a per-package coverage floor (see vitest.config.ts) as the
      # template for future contexts — enforced here, separately from the
      # timed test steps above, since coverage collection isn't free and
      # doesn't need to run for every package on every push yet.
      - name: Identity coverage gate
        run: pnpm --filter @verixa/identity run test:coverage

      # Same pattern applied to packages/sessions (Issue 097): session and
      # token logic is among the highest-stakes code in the system, so it's
      # held to the same enforced floor as identity rather than trusted to
      # `pnpm test` alone.
      - name: Sessions coverage gate
        run: pnpm --filter @verixa/sessions run test:coverage
      # packages/credentials is the second fully-built bounded context,
      # following the Phase 02 coverage-gate pattern established in Issue 037.
      # Enforced separately from the plain `pnpm test` above to keep coverage
      # collection overhead isolated to contexts that require it.
      - name: Credentials coverage gate
        run: pnpm --filter @verixa/credentials run test:coverage

      # packages/audit is the third context under the Phase 02 coverage-gate
      # pattern (Issue 037), applied in Issue 197. The floor matters more here
      # than anywhere else in the monorepo: this is the code that decides
      # whether tampering is *detectable*, and an untested branch in chain
      # verification is a security property that silently does not hold. The
      # gate excludes the Prisma adapters and the operator CLI for the reason
      # stated in packages/audit/vitest.config.ts — they need a live Postgres,
      # and are covered by the database-backed suite instead.
      - name: Audit coverage gate
        run: pnpm --filter @verixa/audit run test:coverage

      # packages/verification was lifted out of quarantine (docs/QUARANTINE.md)
      # alongside packages/sessions; held to the same enforced floor rather
      # than trusted to `pnpm test` alone, for the same reason the contexts
      # above are.
      - name: Verification coverage gate
        run: pnpm --filter @verixa/verification run test:coverage

      # packages/rate-limiting implements Phase 15 rate limiting and abuse
      # prevention. Held to an enforced coverage floor (vitest.config.ts)
      # following the Issue 037 pattern (Issue 298 / #312).
      - name: Rate limiting coverage gate
        run: pnpm --filter @verixa/rate-limiting run test:coverage

  # Verifies the *other* database strategy. The `ci` job above points
  # TEST_DATABASE_URL at a service container, so it never exercises the
  # Testcontainers path in database-harness.ts (Issue 047). This job
  # deliberately omits TEST_DATABASE_URL, forcing the harness to start its own
  # ephemeral Postgres via Docker — otherwise that code would ship untested
  # and only fail for a contributor running tests without compose up.
  #
  # REQUIRE_DATABASE_TESTS=1 makes it a hard failure rather than a skip, so
  # "Testcontainers silently didn't work" cannot pass as green.
  testcontainers:
    runs-on: ubuntu-latest
    env:
      REQUIRE_DATABASE_TESTS: "1"
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      # Re-sync injected workspace packages after building them.
      #
      # `injectWorkspacePackages: true` (required for `pnpm deploy`, which
      # builds the Docker image) makes pnpm *copy* some workspace packages into
      # their dependents' node_modules rather than symlinking. Which ones get
      # copied is decided by peer-dependency resolution -- @verixa/audit and
      # @verixa/stellar-anchor are copied because the Stellar SDK pulls
      # `debug`/`supports-color` peers, while @verixa/identity is symlinked.
      #
      # Those copies are made during install, when no package has a `dist` yet.
      # pnpm refreshes them before running a dependent's own script, so a
      # package that builds gets fresh copies -- but `tests` has no build
      # script, so its copies stayed empty and every integration spec failed
      # with "Failed to resolve entry for package @verixa/audit".
      #
      # Invisible locally, because a developer's node_modules has been through
      # an install *after* a build at some point. Only a clean checkout hits it.
      - name: Re-link workspace packages
        run: pnpm install --frozen-lockfile

      # These packages own Prisma repository contract suites that need a
      # real database.
      - name: Run identity repository contract tests against Testcontainers Postgres
        run: pnpm --filter @verixa/identity run test

      - name: Run authorization repository contract tests against Testcontainers Postgres
        run: pnpm --filter @verixa/authorization run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verixa
          POSTGRES_PASSWORD: verixa
          POSTGRES_DB: verixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verixa -d verixa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_test
      TEST_DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_test
      TEST_REDIS_URL: redis://localhost:6379
      REQUIRE_DATABASE_TESTS: "1"
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Re-link workspace packages
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to test database
        run: pnpm db:migrate:deploy

      - name: Run process-level HTTP smoke test with disposable services
        run: pnpm --filter @verixa/integration-tests run test:e2e

  # Verifies the *compose* stack's database roles, which nothing else covers.
  #
  # The `ci` job talks to a bare service container and the `docker` job builds
  # the production image; neither runs docker-compose.yml, so until this
  # existed the init scripts in infra/postgres/ were unexecuted code. That
  # matters more than an ordinary untested script: they are what stops the API
  # connecting as a superuser, and a superuser bypasses row level security
  # entirely — so a mistake there disables every tenant-isolation policy
  # silently, with nothing failing anywhere. The existing RLS suite does not
  # cover it either, since it creates its own role and therefore tests a
  # connection the application never uses.
  #
  # Deliberately does not boot the `api` service. That means a full install
  # and build inside the container, for a slower and flakier version of what
  # the `docker` job already proves. What is unproven here is narrower: does
  # the role get created, is it actually unprivileged, and does it have
  # exactly the grants the application needs.
  compose-database-roles:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Start Postgres from docker-compose.yml
        run: docker compose up -d --wait postgres

      - name: Confirm compose points the API at the unprivileged role
        run: |
          set -eu
          docker compose config --format json > compose.resolved.json
          url="$(python3 -c "import json; print(json.load(open('compose.resolved.json'))['services']['api']['environment']['DATABASE_URL'])")"
          echo "api DATABASE_URL: $url"
          case "$url" in
            postgres://verixa_app:*) ;;
            *)
              echo "::error::the api service must connect as verixa_app, not as the superuser"
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @verixa/database run db:generate

      # As the owner, which is the split being tested: DDL needs `verixa`, the
      # application gets `verixa_app`. This also exercises the ALTER DEFAULT
      # PRIVILEGES lines, the easy part to get wrong — GRANT ON ALL TABLES
      # covers only tables that exist when it runs, and at init time every
      # table in the schema is still in the future.
      - name: Apply migrations as the owner
        run: pnpm --filter @verixa/database run db:migrate:deploy

      - name: The app role exists and is unprivileged
        run: |
          set -eu
          attrs="$(docker compose exec -T postgres psql -U verixa -d verixa -tAX -c "SELECT rolsuper, rolbypassrls, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = 'verixa_app'")"
          echo "verixa_app (super|bypassrls|createdb|createrole): $attrs"
          if [ -z "$attrs" ]; then
            echo "::error::verixa_app was not created — did the init script run?"
            exit 1
          fi
          if [ "$attrs" != "f|f|f|f" ]; then
            echo "::error::verixa_app must be NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
            exit 1
          fi

      - name: The app role can read and write application tables
        run: |
          set -eu
          docker compose exec -T postgres psql -U verixa_app -d verixa -v ON_ERROR_STOP=1 -c "INSERT INTO users (id, email, display_name, status, created_at, updated_at) VALUES (gen_random_uuid(), 'role-check@example.com', 'Role Check', 'active', now(), now());"
          docker compose exec -T postgres psql -U verixa_app -d verixa -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM users;"

      # The point of the whole exercise. `organizations` has RLS enabled and
      # forced, so without app.current_organization_id set this insert must be
      # refused. A superuser connection sails straight through it, which is
      # exactly the regression being guarded against.
      - name: The app role is subject to row level security
        run: |
          set -eu
          if docker compose exec -T postgres psql -U verixa_app -d verixa -v ON_ERROR_STOP=1 -c "INSERT INTO organizations (id, name, slug, owner_id, status, created_at, updated_at) SELECT gen_random_uuid(), 'Bypass Check', 'bypass-check', id, 'active', now(), now() FROM users LIMIT 1;"; then
            echo "::error::verixa_app bypassed row level security — tenant isolation is not enforced"
            exit 1
          fi
          echo "insert refused by row level security, as required"

      - name: The app role cannot issue DDL
        run: |
          set -eu
          if docker compose exec -T postgres psql -U verixa_app -d verixa -v ON_ERROR_STOP=1 -c "CREATE TABLE should_not_exist (id uuid PRIMARY KEY);"; then
            echo "::error::verixa_app must not be able to create tables"
            exit 1
          fi
          echo "DDL refused, as required"

      - name: Stop the stack
        if: always()
        run: docker compose down -v || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production target image
        run: docker build -f apps/api/Dockerfile --target production -t verixa-api:ci .

      # The waiver validator parses YAML with the workspace's `yaml` package,
      # which this job otherwise never installs. Scripts are skipped: nothing
      # here needs Prisma or the git hooks, only the module on disk.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for the waiver validator
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate documented vulnerability waivers
        run: node infra/ci/check-trivy-waivers.mjs

      - name: Scan OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: verixa-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          vuln-type: os
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-os.json

      - name: Scan application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: verixa-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-dependencies.json

      - name: Archive image scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-ci-${{ github.run_number }}
          path: |
            trivy-os.json
            trivy-dependencies.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run container
        run: |
          docker run -d --name verixa-api -p 3000:3000 \
            -e SESSION_ACCESS_TOKEN_SECRET="ci-smoke-test-secret-at-least-32-characters" \
            verixa-api:ci

      - name: Wait for /health
        run: |
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::verixa-api did not become healthy in time"
          docker logs verixa-api
          exit 1

      - name: Verify HEALTHCHECK instruction status
        run: |
          status="$(docker inspect --format='{{json .State.Health.Status}}' verixa-api || echo 'none')"
          echo "Container health status: $status"

      - name: Verify the container does not run as root
        run: |
          user="$(docker exec verixa-api whoami)"
          echo "Container user: $user"
          if [ "$user" = "root" ]; then
            echo "::error::apps/api container must not run as root"
            exit 1
          fi

      # `whoami` says the name; the number is what an orchestrator enforces.
      # `runAsNonRoot: true` is satisfied by any non-zero UID, and a
      # `securityContext` or a pre-chowned volume that names a UID needs the
      # value to be the one the Dockerfile pins.
      - name: Verify the container runs as an unprivileged UID
        run: |
          set -eu
          uid="$(docker exec verixa-api id -u)"
          gid="$(docker exec verixa-api id -g)"
          echo "Container uid/gid: $uid/$gid"
          if [ "$uid" = "0" ] || [ "$gid" = "0" ]; then
            echo "::error::the API must not run as UID or GID 0"
            exit 1
          fi

      # A package manager inside a production container is a download primitive:
      # `npm install <anything>` turns a foothold into code the operator never
      # approved, fetched from a registry the operator does not control. The
      # runtime stage deletes it, and this is the assertion that it stayed gone.
      - name: Verify the image has no package manager or compiler headers
        run: |
          set -eu
          found="$(docker exec verixa-api sh -c \
            'for tool in /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack /usr/local/lib/node_modules/npm /usr/local/include/node; do [ -e "$tool" ] && echo "$tool"; done' || true)"
          if [ -n "$found" ]; then
            echo "::error::the runtime image still ships build tooling:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "no npm, npx, corepack or node headers in the image"

      # Issue 216: source maps are the original TypeScript, a `*.spec.js` is an
      # executable description of every assumption the test suite makes about the
      # code, and `pnpm deploy` copies each workspace package directory whole —
      # so `apps/api/src/**`, every package's `domain/` tree and the last test
      # run's `coverage/` output all ride into the image unless something
      # removes them. None of it is read at runtime; all of it is useful to
      # whoever ends up with a shell in here.
      - name: Verify the image carries no build residue or first-party source
        run: |
          set -eu
          found="$(docker exec verixa-api sh -c '
            find /app -name "*.js.map" -o -name "*.d.ts.map" -o -name "*.d.ts" -o -name "*.spec.js"
            find /app -name "*.ts" -not -path "*/node_modules/*"
            find /app -path "*/@verixa/*" -name "*.ts"
            find /app -type d -name coverage
          ' 2>&1 | head -20 || true)"
          if [ -n "$found" ]; then
            echo "::error::the runtime image still contains pruned files:"
            printf '%s\n' "$found"
            echo "See scripts/prune-runtime-bundle.mjs and docs/security/container-hardening.md."
            exit 1
          fi
          echo "no source maps, declarations, compiled specs, sources or coverage in the image"

      # `pnpm deploy --prod` is supposed to be what guarantees this, and it does,
      # until something changes the hoisting or the manifest. `testcontainers`
      # and `supertest` reappearing here would be invisible from the diff that
      # caused it.
      - name: Verify the image has no dev dependencies
        run: |
          set -eu
          dev="$(docker exec verixa-api sh -c 'ls /app/node_modules /app/node_modules/.pnpm 2>/dev/null' \
            | grep -E '^(typescript|vitest|tsx|eslint|prettier|husky|lint-staged|supertest|testcontainers|@vitest\+|@types\+|prisma@)' || true)"
          if [ -n "$dev" ]; then
            echo "::error::dev dependencies are present in the runtime image:"
            printf '%s\n' "$dev"
            exit 1
          fi
          echo "no dev dependencies in the bundle"

      # Recorded, not asserted: the size number belongs in the hardening doc only
      # if it was measured on a machine that could build the image, and CI is the
      # only place that is. `docker`'s own size is unpacked-layer metadata, so the
      # in-container figure is the one that says what the filesystem holds.
      - name: Record the image size and contents
        run: |
          set -eu
          docker images verixa-api:ci --format 'image {{.Repository}}:{{.Tag}}  size {{.Size}}'
          docker exec verixa-api sh -c 'du -sh /app; printf "files in /app: "; find /app -type f | wc -l'
          docker exec verixa-api sh -c 'du -sh /app/node_modules /app/dist 2>/dev/null || true'

      - name: Stop container
        if: always()
        run: docker rm -f verixa-api || true

      - name: Build standalone notifications pilot service
        run: docker build -f packages/notifications/Dockerfile --target production -t verixa-notifications:ci .

      - name: Run notifications container
        run: docker run -d --name verixa-notifications -p 3001:3001 verixa-notifications:ci

      - name: Wait for notifications /health
        run: |
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:3001/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::verixa-notifications did not become healthy in time"
          docker logs verixa-notifications
          exit 1

      - name: Stop notifications container
        if: always()
        run: docker rm -f verixa-notifications || true
      # The rollback drill proves that selecting an earlier immutable image
      # restores the code that actually serves requests. The response carries
      # its build version so this assertion cannot pass by checking only that
      # some process answered on the port.
      - name: Build two versioned images for the rollback drill
        run: |
          docker build -f apps/api/Dockerfile --build-arg VERIXA_BUILD_VERSION=drill-a -t verixa-api:drill-a .
          docker build -f apps/api/Dockerfile --build-arg VERIXA_BUILD_VERSION=drill-b -t verixa-api:drill-b .

      - name: Deploy version B before rolling back to version A
        env:
          SESSION_ACCESS_TOKEN_SECRET: ci-rollback-secret-value-at-least-32-characters
          DATABASE_URL: postgres://verixa:verixa@127.0.0.1:5432/verixa
          API_IMAGE: verixa-api
          API_CONTAINER_NAME: verixa-api-drill
          API_PORT: "3001"
          API_BIND_ADDRESS: 127.0.0.1
          API_PULL_IMAGE: "0"
        run: |
          set -eu
          docker run -d --name verixa-api-drill --publish 127.0.0.1:3001:3000 \
            --env SESSION_ACCESS_TOKEN_SECRET="$SESSION_ACCESS_TOKEN_SECRET" \
            --env DATABASE_URL="$DATABASE_URL" \
            verixa-api:drill-b
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -sf http://127.0.0.1:3001/version)" = '{"version":"drill-b"}'
          API_PORT=3001 ./infra/docker/scripts/rollback.sh drill-a
          test "$(curl -sf http://127.0.0.1:3001/version)" = '{"version":"drill-a"}'
          test "$(curl -sf http://127.0.0.1:3001/health)" = '{"status":"ok"}'

      - name: Stop rollback drill container
        if: always()
        run: docker rm -f verixa-api-drill || true

  # Docs-as-code (Issue 422): the VitePress site under docs/ is built on every
  # push, so a broken docs link fails CI the same way a broken import does.
  #
  # `ignoreDeadLinks` is off in docs/.vitepress/config.ts, so a link to a page
  # that doesn't exist fails the build. That's what makes this a check rather
  # than a formality: without it, renaming a doc would quietly break every page
  # linking to it, and the docs would drift from the code in exactly the way
  # docs-as-code exists to prevent. Tutorials also import code regions from
  # real test files (`<<< @/...#region`), so a renamed region fails here too.
  #
  # Needs no workspace build or database: the site reads Markdown and source
  # files, never compiled output. The static site is uploaded so a reviewer
  # can open the rendered docs for a PR without running anything locally.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The site config is TypeScript but belongs to no workspace package, so
      # `pnpm typecheck` (recursive over packages) never sees it.
      - name: Typecheck the docs site config
        run: pnpm exec tsc -p docs/.vitepress/tsconfig.json

      - name: Build the docs site
        run: pnpm docs:build

      - name: Upload the built docs site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-${{ github.run_number }}
          path: docs/.vitepress/dist/
          retention-days: 14

  # Issue 385 / #497. The `docker` job builds the image; this job proves the
  # *overlay* actually produces a production topology when combined with the
  # dev file. Resolving the config first catches merge mistakes (a surviving
  # source bind-mount or dev port) before spending minutes on an image build.
  compose-production-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      REDIS_URL: redis://:ci-redis-password@redis:6379
      DATABASE_URL: postgres://verixa_app:verixa_app@postgres:5432/verixa
      DATABASE_MIGRATION_URL: postgres://verixa:ci-postgres-password@postgres:5432/verixa
      SESSION_ACCESS_TOKEN_SECRET: ci-smoke-secret-at-least-32-characters
      VERIXA_API_IMAGE: verixa-api:ci
      VERIXA_MIGRATION_IMAGE: verixa-migration:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for the config gate
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve and verify the merged production config
        run: |
          set -eu
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > compose.resolved.json
          node infra/ci/compose-config.mjs --check compose.resolved.json

      - name: Start production services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            up -d --build --wait postgres redis migration api

      - name: API serves health on the internal network
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api \
            node -e "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); console.log(r.status); }).catch(() => process.exit(1))"

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes || true

  # README quickstart smoke test (Issue 421). Runs the quickstart a newcomer
  # follows (install, Postgres from docker-compose.yml, migrations, `pnpm dev`)
  # and then one real auth flow, register then log in, failing on any non-2xx.
  #
  # The steps live in scripts/quickstart-smoke.sh, not inline here, so a person
  # can run exactly what CI runs; the script also fails if README.md stops
  # showing any command it runs, which is what keeps the two from drifting. A
  # README whose first command is broken costs every first-time visitor, and
  # nothing else in this pipeline would notice: the `ci` job uses a service
  # container and builds before it tests, which is not what the README says.
  #
  # Deliberately no `pnpm build` beforehand. Starting from a fresh checkout is
  # the point.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Run the README quickstart and one auth flow
        run: bash scripts/quickstart-smoke.sh

      - name: Stop the compose stack
        if: always()
        run: docker compose down -v

  # Issue 386 / #498. This is a restore drill, not a file-existence check:
  # seed data, back it up, recreate the containers without their volumes to
  # prove the data was really in the named volumes, then destroy the volumes
  # and restore from the dumps. A backup that was never restored is a guess.
  compose-backup-restore:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      DATABASE_URL: postgres://verixa_app:verixa_app@postgres:5432/verixa
      DATABASE_MIGRATION_URL: postgres://verixa:ci-postgres-password@postgres:5432/verixa
      REDIS_URL: redis://:ci-redis-password@redis:6379
      SESSION_ACCESS_TOKEN_SECRET: ci-smoke-secret-at-least-32-characters
      VERIXA_API_IMAGE: verixa-api:ci
      VERIXA_MIGRATION_IMAGE: verixa-migration:ci
      PGUSER: verixa
      PGPASSWORD: ci-postgres-password
      REDISCLI_AUTH: ci-redis-password
      VERIXA_RESTORE_CONFIRM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Start stateful services
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait postgres redis

      - name: Seed probe data
        run: |
          set -eu
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
            psql -U verixa -d verixa -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS backup_probe (id text PRIMARY KEY, value text); INSERT INTO backup_probe (id, value) VALUES ('probe-1', 'before') ON CONFLICT (id) DO UPDATE SET value = 'before';"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" SET backup_probe before

      - name: Back up the running containers
        run: |
          node infra/docker/scripts/backup.mjs \
            --compose-file docker-compose.yml --compose-file docker-compose.prod.yml \
            --output-dir backups --label ci
          chmod 644 backups/redis-ci.rdb || true
          test -s backups/postgres-ci.dump
          test -s backups/redis-ci.rdb

      - name: Recreate containers without deleting volumes
        run: |
          set -eu
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait postgres redis
          value="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres psql -U verixa -d verixa -tAX -c "SELECT value FROM backup_probe WHERE id = 'probe-1'")"
          test "$value" = "before"
          value="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T redis redis-cli -a "$REDIS_PASSWORD" GET backup_probe | tr -d '\r')"
          test "$value" = "before"

      - name: Destroy the named volumes
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes

      - name: Start with empty volumes and restore
        run: |
          set -eu
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait postgres redis
          node infra/docker/scripts/restore.mjs \
            --compose-file docker-compose.yml --compose-file docker-compose.prod.yml \
            --dump backups/postgres-ci.dump --rdb backups/redis-ci.rdb

      - name: Assert restored data
        run: |
          set -eu
          value="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres psql -U verixa -d verixa -tAX -c "SELECT value FROM backup_probe WHERE id = 'probe-1'")"
          test "$value" = "before"
          value="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T redis redis-cli -a "$REDIS_PASSWORD" GET backup_probe | tr -d '\r')"
          test "$value" = "before"

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes || true

  # Issue 387 / #499. Uses the same nginx.conf as production with a stub API,
  # so a redirect or handshake regression in the shipped config fails here.
  compose-tls-smoke:
    runs-on: ubuntu-latest
    env:
      PORT_HTTP: "18080"
      PORT_HTTPS: "18443"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert HTTP redirect, TLS handshake and upstream forwarding
        run: node infra/ci/compose-tls-smoke.mjs
