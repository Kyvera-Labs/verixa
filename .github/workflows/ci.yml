name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace package must be built before anything that imports
      # it can be reliably linted, typechecked, or tested — see
      # docs/guides/typescript-conventions.md and docs/guides/ci-cd.md for
      # why this isn't just belt-and-suspenders: package.json "exports"
      # subpaths (unlike "main") have no fallback when the target file is
      # missing, so type-aware linting fails outright, not gracefully, on
      # an unbuilt dependency.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # packages/identity is the first fully-built bounded context, and
      # carries a per-package coverage floor (see vitest.config.ts) as the
      # template for future contexts — enforced here, separately from the
      # plain `pnpm test` above, since coverage collection isn't free and
      # doesn't need to run for every package on every push yet.
      - name: Identity coverage gate
        run: pnpm --filter @verixa/identity run test:coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t verixa-api:ci .

      - name: Run container
        run: docker run -d --name verixa-api -p 3000:3000 verixa-api:ci

      - name: Wait for /health
        run: |
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::verixa-api did not become healthy in time"
          docker logs verixa-api
          exit 1

      - name: Verify the container does not run as root
        run: |
          user="$(docker exec verixa-api whoami)"
          echo "Container user: $user"
          if [ "$user" = "root" ]; then
            echo "::error::apps/api container must not run as root"
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker rm -f verixa-api || true
