name: Publish API container

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "infra/docker/**"
      - "infra/ci/docker-cache-check.mjs"
      - ".github/workflows/docker-publish.yml"
      - "pnpm-lock.yaml"

# A commit tag identifies content and must never be silently replaced by a
# rebuild. The per-SHA group serializes retries; the immutability check below
# makes a retry fail visibly instead of changing what that reference runs.
concurrency:
  group: container-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tags
        id: tags
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          node infra/ci/container-tags.mjs > tags.txt
          {
            echo 'tags<<EOF'
            sed 's#^#ghcr.io/kyvera-labs/verixa:#' tags.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # The commit tag is the first line container-tags.mjs emitted, so this
      # checks exactly the reference the publish step is about to push. It has
      # to run before the build, once pushing has already happened is too late.
      - name: Refuse to overwrite an existing commit image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/kyvera-labs/verixa
        run: |
          set -eu
          COMMIT_TAG="$(head -n 1 tags.txt)"
          if docker buildx imagetools inspect "$IMAGE:$COMMIT_TAG" >/dev/null 2>&1; then
            echo "::error::immutable image tag $IMAGE:$COMMIT_TAG already exists"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (apps/api)
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/verixa-api
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # GHA cache is registry-backed: it survives runner replacement between
      # pushes, which a local BuildKit cache cannot. mode=max exports the
      # intermediate stages too, so a source-only commit can reuse the install
      # layer rather than just the final image. The scope keeps the API cache
      # separate from any future image built by the bake targets.
      - name: Build and push multi-arch image (apps/api)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: VERIXA_BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=verixa-api
          cache-to: type=gha,mode=max,scope=verixa-api

      - name: Verify buildx bake configuration
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: infra/docker/buildx-bake.hcl
          targets: api
          set: |
            *.push=false

  # A cache that is configured but never exercised is a cache that silently
  # stopped working. This job measures a cold build, a source-only rebuild and
  # a manifest-change rebuild, and asserts both BuildKit's own CACHED verdict
  # and the end-to-end timing. The local cache is exported by the cold build
  # and imported by the two rebuilds so the measurement is about layer reuse,
  # not about an empty runner cache.
  cache-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check cache configuration
        run: node infra/ci/docker-cache-check.mjs --repo .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cold dependency build
        id: cold
        run: |
          set -eu
          start="$(date +%s)"
          docker buildx build --progress=plain --no-cache \
            --cache-to type=local,dest=/tmp/verixa-build-cache,mode=max \
            -f apps/api/Dockerfile --target deps -t verixa-cache:cold . 2>&1 | tee build-cold.log
          end="$(date +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Change application source only
        run: printf '\n' >> apps/api/src/app.ts

      - name: Source-only rebuild
        id: source
        run: |
          set -eu
          start="$(date +%s)"
          docker buildx build --progress=plain \
            --cache-from type=local,src=/tmp/verixa-build-cache \
            -f apps/api/Dockerfile --target deps -t verixa-cache:source . 2>&1 | tee build-source.log
          end="$(date +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Assert pnpm install was cached on the source-only rebuild
        run: node infra/ci/docker-cache-check.mjs assert-log --log build-cold.log --expect rebuilt && node infra/ci/docker-cache-check.mjs assert-log --log build-source.log --expect cached

      - name: Change a package manifest
        run: |
          node -e "const fs=require('node:fs'); const p='package.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); v.description=(v.description||'')+' cache-check'; fs.writeFileSync(p, JSON.stringify(v,null,2)+'\n')"

      - name: Manifest-change rebuild
        run: |
          docker buildx build --progress=plain \
            --cache-from type=local,src=/tmp/verixa-build-cache \
            -f apps/api/Dockerfile --target deps -t verixa-cache:manifest . 2>&1 | tee build-manifest.log

      # The invalidation half of the check: cache reuse is only useful if a
      # real dependency change still reinstalls. A log that says CACHED here
      # would mean a stale-dependency false negative.
      - name: Assert pnpm install reran after the manifest change
        run: node infra/ci/docker-cache-check.mjs assert-log --log build-manifest.log --expect rebuilt

      - name: Assert rebuilds are a fraction of the cold build
        run: |
          node infra/ci/docker-cache-check.mjs assert-timings \
            --cold "${{ steps.cold.outputs.seconds }}" \
            --warm "${{ steps.source.outputs.seconds }}" \
            --source "${{ steps.source.outputs.seconds }}"
