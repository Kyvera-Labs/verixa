name: Release

# Automated release pipeline:
# 1. On push to `main`: runs `semantic-release` (Issue 368 / #480) to analyze
#    Conventional Commits since the last tag, compute the next SemVer version,
#    create the annotated git tag (`vX.Y.Z`), and publish a GitHub Release with
#    generated release notes.
# 2. On semver tag push (`vX.Y.Z`): generates and attaches the CycloneDX SBOM
#    (Issue 215) to the release from the exact locked dependency graph at that
#    commit.
#
# Keeping both jobs in release.yml preserves the existing tag-triggered SBOM
# contract while ensuring `semantic-release` runs strictly on `main`.

on:
  push:
    branches:
      - main
    tags:
      # A full semver tag, not `v*`. A half-matching trigger is worse than none:
      # a tag like `v2-migration-experiment` would produce an SBOM that looks
      # like a release artifact for a release that never happened, and the
      # people downstream reading it have no way to tell the two apart.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Runs are not cancelled: a release or tag is immutable in practice, and two
# concurrent runs for the same ref would race on the same release asset.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `contents: write` is required by semantic-release to push tags and create
  # GitHub Releases, and by the SBOM job to attach release assets.
  # `issues: write` and `pull-requests: write` allow @semantic-release/github
  # to comment on released issues/PRs.
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    name: Compute version and publish GitHub Release
    # Runs strictly on pushes to `main` — never on pull requests or feature
    # branches, so unreleased commits cannot publish tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so semantic-release can walk commits back
          # to the previous release tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Uses .releaserc.json at the monorepo root with
      # @semantic-release/commit-analyzer, @semantic-release/release-notes-generator,
      # and @semantic-release/github.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@24
          -p @semantic-release/commit-analyzer@13
          -p @semantic-release/release-notes-generator@14
          -p @semantic-release/github@11
          -p conventional-changelog-conventionalcommits@8
          semantic-release

  sbom:
    name: Generate and publish the CycloneDX SBOM
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same gate CI runs first, for the same reason, one level up in
      # stakes: a test suite run against a drifted graph produces a wrong
      # answer, but an SBOM of one produces a document an auditor relies on.
      # Runs before any install, and as plain `node` — see the note on the
      # equivalent step in ci.yml.
      - name: Check lockfile integrity
        run: node infra/ci/check-lockfile-integrity.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes sbom/verixa.cdx.json (gitignored — see .gitignore) and refuses to
      # write it at all if the document does not validate against the CycloneDX
      # 1.6 schema, because a malformed BOM that ships anyway reads as evidence
      # a supply-chain review happened when it did not.
      - name: Generate the SBOM
        run: pnpm sbom:generate

      # Re-reads the file from disk instead of trusting that the string the
      # generator validated in memory is the string that got written. Cheap, and
      # it is the artifact downstream tooling will actually open.
      - name: Validate the artifact on disk
        run: pnpm sbom:generate --validate-only sbom/verixa.cdx.json

      # Always available straight from the workflow run, even for a tag that
      # never becomes a release, and even if the step below is denied by
      # branch-protection rules on token permissions.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verixa-sbom-${{ github.ref_name }}
          path: sbom/verixa.cdx.json

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu

          # An existing release is never rewritten. Whoever published it chose
          # its title, notes and prerelease flag, and a workflow that clobbers
          # that is a surprising neighbour to have. It is only created here when
          # the tag was pushed by hand and has no release at all, which would
          # otherwise leave the SBOM with nowhere to live.
          gh release view "$TAG" --json tagName >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes

          # --clobber replaces a previous SBOM for the same tag rather than
          # leaving two conflicting inventories attached to one release.
          gh release upload "$TAG" sbom/verixa.cdx.json --clobber
