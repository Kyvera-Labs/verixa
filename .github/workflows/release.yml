name: Release

# Phase 19 — Automated release orchestration (Issues 369, 370, 371 / #481, #482, #483)
# and CycloneDX SBOM generation (Issue 215).
#
# Why one coordinated workflow instead of three disconnected ones:
# A release should be a single, atomic, traceable bundle (git tag + generated
# CHANGELOG.md + GitHub Release notes + CycloneDX SBOM + Docker image digest)
# rather than loosely-connected side effects a maintainer has to manually
# reconcile. Draft releases never leak because @semantic-release/github only
# publishes the GitHub Release after commit analysis, changelog preparation,
# SBOM validation, and digest resolution all succeed.
#
# Per-package npm publishing runs via Changesets + `pnpm publish --provenance`
# so each standalone bounded-context package under `packages/*` versions and
# publishes independently, and `workspace:*` protocol specifiers are rewritten
# to concrete semver ranges natively by pnpm.

on:
  push:
    branches:
      - main
    tags:
      # A full semver tag, not `v*`. A half-matching trigger is worse than none:
      # a tag like `v2-migration-experiment` would produce an SBOM that looks
      # like a release artifact for a release that never happened, and the
      # people downstream reading it have no way to tell the two apart.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release and package publish checks in dry-run mode without publishing"
        required: false
        type: boolean
        default: true

# Runs are not cancelled: a release or tag is immutable in practice, and two
# concurrent runs for the same ref would race on the same release asset or npm
# version. The group is per-ref so releasing two versions in quick succession
# does not serialize them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Automated semantic-release: CHANGELOG.md + GitHub Release + Artifacts
  #    (Issues #481 & #483)
  # ---------------------------------------------------------------------------
  semantic-release:
    name: Semantic release and GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Required by @semantic-release/git (commits CHANGELOG.md + creates tag)
      # and @semantic-release/github (publishes the GitHub Release + uploads
      # the CycloneDX SBOM and Docker image digest artifacts).
      contents: write
      issues: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so @semantic-release/commit-analyzer can
          # walk commits back to the previous semver tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Check lockfile integrity
        run: node infra/ci/check-lockfile-integrity.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produce and validate the CycloneDX SBOM from the exact commit being
      # released so @semantic-release/github attaches it atomically to the
      # GitHub Release alongside the generated notes.
      - name: Generate and validate CycloneDX SBOM
        run: |
          pnpm sbom:generate
          pnpm sbom:generate --validate-only sbom/verixa.cdx.json

      # Resolve the immutable Docker image digest published by docker-publish.yml
      # for this commit SHA (Issue 365). Written to a release artifact file so
      # consumers can pin by digest directly from the GitHub Release page.
      - name: Resolve Docker image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/verixa-api
        run: |
          set -eu
          mkdir -p release-artifacts
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE_REF="${IMAGE_REPO}:sha-${SHORT_SHA}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          if [ -n "$DIGEST" ]; then
            printf '%s@%s\n' "$IMAGE_REPO" "$DIGEST" > release-artifacts/docker-image-digest.txt
          else
            printf 'pending: %s (image not yet published to ghcr.io for commit %s)\n' "$IMAGE_REF" "${{ github.sha }}" > release-artifacts/docker-image-digest.txt
          fi
          cat release-artifacts/docker-image-digest.txt

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && 'true' || 'false' }}
        run: |
          set -eu
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/git@10 \
            -p conventional-changelog-conventionalcommits@8 \
            semantic-release $DRY_FLAG

  # ---------------------------------------------------------------------------
  # 2. Independent per-package npm publishing via Changesets (Issue #482)
  # ---------------------------------------------------------------------------
  publish-packages:
    name: Publish monorepo packages to npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required by `pnpm publish --provenance` to mint a Sigstore OIDC
      # provenance attestation tying each npm tarball to this exact workflow
      # run and git commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check lockfile integrity
        run: node infra/ci/check-lockfile-integrity.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build all workspace packages
        run: |
          pnpm db:generate
          pnpm build

      - name: Verify release and changeset configuration
        run: node infra/ci/check-release-config.mjs

      # Dry-run mode on workflow_dispatch validates which packages have pending
      # changesets without mutating versions or publishing to npm.
      - name: Dry-run changeset status
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != false
        run: pnpm dlx @changesets/cli status --verbose

      # On a real push to main (or workflow_dispatch with dry_run=false):
      # - If pending changesets exist, opens/updates a "Version Packages" PR
      #   bumping ONLY the affected packages (unrelated packages stay untouched).
      # - Once that PR is merged, publishes ONLY the bumped packages to npm
      #   using a 2FA-safe granular automation token (NPM_TOKEN) and OIDC
      #   provenance (`--provenance`). Never uses a personal token.
      - name: Create Version PR or publish changed packages to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        uses: changesets/action@v1
        with:
          version: pnpm dlx @changesets/cli version
          publish: pnpm -r publish --access public --provenance --no-git-checks
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # ---------------------------------------------------------------------------
  # 3. CycloneDX SBOM generation on manual or semantic-release semver tags
  #    (Issue 215)
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate and publish the CycloneDX SBOM
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The same gate CI runs first, for the same reason, one level up in
      # stakes: a test suite run against a drifted graph produces a wrong
      # answer, but an SBOM of one produces a document an auditor relies on.
      # Runs before any install, and as plain `node` — see the note on the
      # equivalent step in ci.yml.
      - name: Check lockfile integrity
        run: node infra/ci/check-lockfile-integrity.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes sbom/verixa.cdx.json (gitignored — see .gitignore) and refuses to
      # write it at all if the document does not validate against the CycloneDX
      # 1.6 schema, because a malformed BOM that ships anyway reads as evidence
      # a supply-chain review happened when it did not.
      - name: Generate the SBOM
        run: pnpm sbom:generate

      # Re-reads the file from disk instead of trusting that the string the
      # generator validated in memory is the string that got written. Cheap, and
      # it is the artifact downstream tooling will actually open.
      - name: Validate the artifact on disk
        run: pnpm sbom:generate --validate-only sbom/verixa.cdx.json

      # Always available straight from the workflow run, even for a tag that
      # never becomes a release, and even if the step below is denied by
      # branch-protection rules on token permissions.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verixa-sbom-${{ github.ref_name }}
          path: sbom/verixa.cdx.json

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu

          # An existing release is never rewritten. Whoever published it chose
          # its title, notes and prerelease flag, and a workflow that clobbers
          # that is a surprising neighbour to have. It is only created here when
          # the tag was pushed by hand and has no release at all, which would
          # otherwise leave the SBOM with nowhere to live.
          gh release view "$TAG" --json tagName >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes

          # --clobber replaces a previous SBOM for the same tag rather than
          # leaving two conflicting inventories attached to one release.
          gh release upload "$TAG" sbom/verixa.cdx.json --clobber
