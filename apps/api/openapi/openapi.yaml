openapi: 3.1.0
info:
  title: Verixa API
  version: 0.1.0
  summary: OpenAPI-first contract for the Verixa REST API.
  description: >-
    The contract is authored before route implementations. Reserved tags keep
    the bounded-context surface stable while each context adds operations in
    its own focused change.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.example.com
    description: Replace with the deployment's public API origin.
tags:
  - name: Identity
    description: Users and organizations.
  - name: Credentials
    description: Password registration, authentication, and recovery.
  - name: Sessions
    description: Session lifecycle and token operations.
  - name: MFA
    description: Multi-factor authentication ceremonies.
  - name: Authorization
    description: Roles, permissions, and policy decisions.
  - name: Verification
    description: Identity verification requests and evidence.
  - name: Audit
    description: Audit event queries and integrity verification.
  - name: Governance
    description: Administrative governance operations.
  - name: Notifications
    description: Delivery and notification preferences.
paths:
  /v1/organizations/{organizationId}/children:
    get:
      tags:
        - Identity
      summary: List direct child organizations
      description: Returns only immediate children; organization hierarchies are intentionally one level deep.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Direct child organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/audit:
    get:
      tags:
        - Audit
      summary: Query organization audit log
      description: Returns a paginated list of audit events for the authenticated reader's organization.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Keyset cursor from previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max number of items to return (1-100, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: actorId
          in: query
          required: false
          description: Filter by actor ID
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          description: Filter by subject ID
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Lower bound on occurredAt (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Upper bound on occurredAt (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit event list
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  nextCursor:
                    type: [string, "null"]
                  hasMore:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/audit/export:
    get:
      tags:
        - Audit
      summary: Stream audit log export
      description: Streams organization audit log as CSV or JSONL.
      parameters:
        - name: format
          in: query
          required: false
          description: Export format (csv or jsonl)
          schema:
            type: string
            enum: [csv, jsonl]
            default: jsonl
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Streamed audit log
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/organizations:
    get:
      tags:
        - Governance
      summary: List organizations
      description: Returns all active organizations to a platform administrator.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Governance
      summary: Create an organization
      description: Creates an organization and its initial owner membership.
      security:
        - bearerAuth: []
  /admin/organizations/{orgId}/compliance-cases:
    parameters:
      - $ref: "#/components/parameters/ComplianceOrgId"
    post:
      tags: [Governance]
      summary: Open a compliance case
      description: >-
        Opens a case in the initial state of the chosen workflow. Requires
        `compliance-cases:write` in the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: The created organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - Governance
      summary: Get an organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The requested organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Governance
      summary: Update an organization
      description: Updates the mutable organization fields and returns the resource.
      security:
        - bearerAuth: []
              $ref: "#/components/schemas/ComplianceCaseCreate"
      responses:
        "201":
          description: Case opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ComplianceForbidden"
    get:
      tags: [Governance]
      summary: List compliance cases
      description: >-
        Lists the organization's cases, oldest first, optionally filtered. All
        supplied filters must match. Requires `compliance-cases:read`.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplianceWorkflowType"
        - name: assignee
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching cases
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComplianceCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ComplianceForbidden"
  /admin/organizations/{orgId}/compliance-cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/ComplianceOrgId"
      - $ref: "#/components/parameters/ComplianceCaseId"
    get:
      tags: [Governance]
      summary: Get a compliance case with its state history and approvals
      description: Requires `compliance-cases:read`.
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCase"
        "403":
          $ref: "#/components/responses/ComplianceForbidden"
        "404":
          $ref: "#/components/responses/ComplianceNotFound"
  /admin/organizations/{orgId}/compliance-cases/{caseId}/transitions:
    parameters:
      - $ref: "#/components/parameters/ComplianceOrgId"
      - $ref: "#/components/parameters/ComplianceCaseId"
    post:
      tags: [Governance]
      summary: Apply a workflow event to a case
      description: >-
        The client names an event; the server transition table decides the
        destination state. A client-supplied target state is never accepted.
        Responds 409 when the event is not legal from the current state, or
        when it is a gated transition and the approval chain is not satisfied
        (or was rejected). Requires `compliance-cases:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceCaseTransition"
      responses:
        "200":
          description: Case after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ComplianceForbidden"
        "404":
          $ref: "#/components/responses/ComplianceNotFound"
        "409":
          $ref: "#/components/responses/ComplianceConflict"
  /admin/organizations/{orgId}/compliance-cases/{caseId}/approvals:
    parameters:
      - $ref: "#/components/parameters/ComplianceOrgId"
      - $ref: "#/components/parameters/ComplianceCaseId"
    post:
      tags: [Governance]
      summary: Record an approval or rejection
      description: >-
        Fills one approval slot. Requires `compliance-cases:approve` and, for
        the requested role, `compliance-cases:approve:<role>`. A role the
        caller may not use is answered with the same 403 as any other denial.
        One person can record only one decision per case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
              $ref: "#/components/schemas/ComplianceCaseApproval"
      responses:
        "200":
          description: Case after the decision was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ComplianceForbidden"
        "404":
          $ref: "#/components/responses/ComplianceNotFound"
        "409":
          $ref: "#/components/responses/ComplianceConflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token supplied by a trusted client.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Machine credential; never place it in a URL.
  schemas:
    OrganizationResponse:
      type: object
      required: [id, name, slug, ownerId, parentOrganizationId, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string }
        parentOrganizationId: { type: [string, "null"] }
        status: { type: string, enum: [active, suspended, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ComplianceWorkflowType:
      type: string
      enum: [verification-review, data-subject-request]
    ComplianceCaseCreate:
      type: object
      required: [workflowType, title]
      properties:
        workflowType:
          $ref: "#/components/schemas/ComplianceWorkflowType"
        title:
          type: string
          minLength: 1
          maxLength: 200
        assigneeId:
          type: [string, "null"]
    ComplianceCaseTransition:
      type: object
      required: [event]
      properties:
        event:
          type: string
          description: Workflow event name, for example `begin_review`. Not a state.
        assigneeId:
          type: [string, "null"]
          description: Optionally hands the case over as part of the move.
    ComplianceCaseApproval:
      type: object
      required: [role, decision]
      properties:
        role:
          type: string
        decision:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
          maxLength: 1000
    ComplianceCase:
      type: object
      required:
        - id
        - organizationId
        - workflowType
        - title
        - state
        - assigneeId
        - availableEvents
        - approvals
        - history
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        organizationId: { type: string }
        workflowType:
          $ref: "#/components/schemas/ComplianceWorkflowType"
        title: { type: string }
        state: { type: string }
        assigneeId: { type: [string, "null"] }
        availableEvents:
          type: array
          items: { type: string }
        approvals:
          type: object
          required: [requiredRoles, pendingRoles, satisfied, rejected, records]
          properties:
            requiredRoles:
              type: array
              items: { type: string }
            pendingRoles:
              type: array
              items: { type: string }
            satisfied: { type: boolean }
            rejected: { type: boolean }
            records:
              type: array
              items:
                type: object
                required: [role, approverId, decision, decidedAt]
                properties:
                  role: { type: string }
                  approverId: { type: string }
                  decision:
                    type: string
                    enum: [approved, rejected]
                  decidedAt: { type: string, format: date-time }
                  comment: { type: string }
        history:
          type: array
          description: Append-only state history, oldest first.
          items:
            type: object
            required: [fromState, toState, event, actorId, occurredAt]
            properties:
              fromState: { type: [string, "null"] }
              toState: { type: string }
              event: { type: string }
              actorId: { type: string }
              occurredAt: { type: string, format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ComplianceError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Safe message suitable for the caller.
        details:
          type: object
          additionalProperties: true
          description: Optional validation or domain details; never include secrets.
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, message, fields]
      properties:
        error:
          type: string
          const: validation_error
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug, ownerId, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string }
        status: { type: string, enum: [active, suspended, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug, ownerId]
      properties:
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string }
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        slug: { type: string }
  parameters:
    ComplianceOrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    ComplianceCaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      description: Opaque request identifier.
      schema:
        type: string
        minLength: 1
  responses:
    ComplianceForbidden:
      description: Not authenticated, or lacking the required permission. The body never names the permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ComplianceError"
    ComplianceNotFound:
      description: No such case in this organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ComplianceError"
    ComplianceConflict:
      description: Illegal transition, approval gate not satisfied, or duplicate approval.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ComplianceError"
    BadRequest:
      description: The request shape or value is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist or is not visible to this principal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
