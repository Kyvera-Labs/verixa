openapi: 3.1.0
info:
  title: Verixa API
  version: 0.1.0
  summary: OpenAPI-first contract for the Verixa REST API.
  description: >-
    The contract is authored before route implementations. Reserved tags keep
    the bounded-context surface stable while each context adds operations in
    its own focused change.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.example.com
    description: Replace with the deployment's public API origin.
tags:
  - name: Identity
    description: Users and organizations.
  - name: Credentials
    description: Password registration, authentication, and recovery.
  - name: Sessions
    description: Session lifecycle and token operations.
  - name: MFA
    description: Multi-factor authentication ceremonies.
  - name: Authorization
    description: Roles, permissions, and policy decisions.
  - name: Verification
    description: Identity verification requests and evidence.
  - name: Audit
    description: Audit event queries and integrity verification.
  - name: Governance
    description: Administrative governance operations.
  - name: Notifications
    description: Delivery and notification preferences.
paths:
  /v1/audit:
    get:
      tags:
        - Audit
      summary: Query organization audit log
      description: Returns a paginated list of audit events for the authenticated reader's organization.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Keyset cursor from previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max number of items to return (1-100, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: actorId
          in: query
          required: false
          description: Filter by actor ID
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          description: Filter by subject ID
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Lower bound on occurredAt (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Upper bound on occurredAt (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit event list
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  nextCursor:
                    type: [string, "null"]
                  hasMore:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/audit/export:
    get:
      tags:
        - Audit
      summary: Stream audit log export
      description: Streams organization audit log as CSV or JSONL.
      parameters:
        - name: format
          in: query
          required: false
          description: Export format (csv or jsonl)
          schema:
            type: string
            enum: [csv, jsonl]
            default: jsonl
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Streamed audit log
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token supplied by a trusted client.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Machine credential; never place it in a URL.
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Safe message suitable for the caller.
        details:
          type: object
          additionalProperties: true
          description: Optional validation or domain details; never include secrets.
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, message, fields]
      properties:
        error:
          type: string
          const: validation_error
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      description: Opaque request identifier.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: The request shape or value is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist or is not visible to this principal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
