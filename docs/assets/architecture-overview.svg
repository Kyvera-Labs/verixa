<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Verixa architecture overview</title>
  <desc id="desc">HTTP clients call apps/api, a Fastify application that is the composition root. It reads configuration through @verixa/config and wires the bounded-context packages identity, credentials, MFA, authorization and audit. Sessions, verification, notifications and rate-limiting are context packages it does not wire up yet. Every context package is layered: domain at the centre, application with use cases and ports around it, and infrastructure adapters on the outside, with dependencies pointing inward. Contexts build on the shared kernel. Persistence adapters reach PostgreSQL through @verixa/database and Prisma. The audit log's hash-chain head can optionally be anchored to the Stellar network through @verixa/stellar-anchor. @verixa/testing-kit provides builders, factories, fakes and contract tests to the test suites only.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Explicit background: the diagram reads the same on GitHub's light and dark themes. -->
  <rect x="0" y="0" width="960" height="640" rx="12" fill="#ffffff"/>

  <g font-size="14" fill="#0f172a">
    <!-- Clients -->
    <rect x="390" y="20" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="480" y="47" text-anchor="middle">HTTP clients</text>
    <line x1="480" y1="64" x2="480" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- API -->
    <rect x="200" y="96" width="560" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="124" text-anchor="middle" font-weight="600">apps/api — Fastify, the composition root</text>
    <text x="480" y="146" text-anchor="middle" font-size="12.5" fill="#1e3a8a">REST routes (/auth, /admin, /verification), GraphQL, OpenAPI</text>
    <text x="480" y="164" text-anchor="middle" font-size="12.5" fill="#1e3a8a">reads validated environment through @verixa/config</text>
    <line x1="480" y1="174" x2="480" y2="204" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="490" y="194" font-size="12" fill="#475569">constructs use cases and adapters</text>

    <!-- Context packages -->
    <rect x="40" y="208" width="880" height="196" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
    <text x="60" y="232" font-weight="600">Bounded-context packages (packages/*)</text>

    <g font-size="13">
      <rect x="60" y="246" width="98" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="109" y="268" text-anchor="middle">identity</text>
      <rect x="166" y="246" width="110" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="221" y="268" text-anchor="middle">credentials</text>
      <rect x="284" y="246" width="70" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="319" y="268" text-anchor="middle">mfa</text>
      <rect x="60" y="288" width="98" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="109" y="310" text-anchor="middle" font-size="12.5">authorization</text>
      <rect x="166" y="288" width="110" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="221" y="310" text-anchor="middle">audit</text>
      <rect x="284" y="288" width="70" height="34" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="319" y="310" text-anchor="middle">sessions</text>
      <rect x="60" y="330" width="98" height="34" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="109" y="352" text-anchor="middle">verification</text>
      <rect x="166" y="330" width="110" height="34" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="221" y="352" text-anchor="middle">notifications</text>
      <rect x="284" y="330" width="70" height="34" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="319" y="347" text-anchor="middle" font-size="11.5">rate-</text>
      <text x="319" y="360" text-anchor="middle" font-size="11.5">limiting</text>
    </g>
    <text x="60" y="390" font-size="12" fill="#475569">Curated index.ts each; deep imports fail lint.</text>

    <!-- Layering detail -->
    <text x="640" y="232" text-anchor="middle" font-size="13" font-weight="600">Inside every context package</text>
    <rect x="410" y="242" width="460" height="148" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="640" y="262" text-anchor="middle" font-size="12.5">infrastructure — Prisma repositories, HTTP clients, in-memory fakes</text>
    <rect x="450" y="272" width="380" height="106" rx="9" fill="#fde68a" stroke="#d97706"/>
    <text x="640" y="292" text-anchor="middle" font-size="12.5">application — use cases, and the ports they need</text>
    <rect x="510" y="304" width="260" height="62" rx="8" fill="#fcd34d" stroke="#b45309"/>
    <text x="640" y="330" text-anchor="middle" font-size="12.5" font-weight="600">domain</text>
    <text x="640" y="350" text-anchor="middle" font-size="12">entities, value objects, invariants</text>
    <text x="640" y="400" text-anchor="middle" font-size="12" fill="#475569">Dependencies point inward; the domain imports no framework or database.</text>

    <!-- Arrows down -->
    <line x1="200" y1="404" x2="200" y2="438" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="480" y1="404" x2="480" y2="438" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="760" y1="404" x2="760" y2="438" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Foundations -->
    <rect x="80" y="442" width="240" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="200" y="465" text-anchor="middle">@verixa/shared-kernel</text>
    <text x="200" y="485" text-anchor="middle" font-size="12" fill="#4c1d95">Result, branded ids, errors, clock</text>

    <rect x="360" y="442" width="240" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="480" y="465" text-anchor="middle">@verixa/database</text>
    <text x="480" y="485" text-anchor="middle" font-size="12" fill="#4c1d95">Prisma schema, client, migrations</text>

    <rect x="640" y="442" width="240" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="760" y="465" text-anchor="middle">@verixa/stellar-anchor</text>
    <text x="760" y="485" text-anchor="middle" font-size="12" fill="#4c1d95">HashAnchor adapter (optional)</text>

    <line x1="480" y1="498" x2="480" y2="530" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="760" y1="498" x2="760" y2="530" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- External systems -->
    <rect x="380" y="534" width="200" height="44" rx="22" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="480" y="561" text-anchor="middle">PostgreSQL</text>
    <rect x="640" y="534" width="240" height="44" rx="22" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="760" y="561" text-anchor="middle" font-size="12.5">Stellar network (audit head hash)</text>

    <!-- Testing -->
    <rect x="80" y="534" width="240" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="200" y="553" text-anchor="middle" font-size="13">@verixa/testing-kit</text>
    <text x="200" y="570" text-anchor="middle" font-size="11.5" fill="#475569">builders, fakes — for tests only</text>

    <text x="480" y="616" text-anchor="middle" font-size="12" fill="#475569">Solid borders: wired into the API by the composition root. Light borders: context packages it does not wire up yet.</text>
  </g>
</svg>
