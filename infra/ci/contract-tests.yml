name: Contract Tests

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/ci/contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/ci/contract-tests.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run OpenAPI Contract Tests
        run: pnpm --filter @verixa/api test -- tests/contract/openapi-contract.test.ts
