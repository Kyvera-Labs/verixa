# TLS smoke stack (Issue 387 / #499).
#
# Reuses the production nginx.conf and certificate directory, but replaces the
# API with a tiny nginx stub listening on 3000. That keeps the CI assertion on
# exactly the redirect, handshake and upstream forwarding behavior that ships,
# without building the whole monorepo image to check a proxy directive.

services:
  api:
    image: nginx:alpine
    volumes:
      - ../ci/fixtures/tls-smoke/api.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - verixa-tls-smoke

  proxy:
    image: nginx:alpine
    ports:
      - "${PORT_HTTP:-18080}:80"
      - "${PORT_HTTPS:-18443}:443"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/certs:/etc/nginx/certs:ro
      - ../../infra/nginx/certbot:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - verixa-tls-smoke

networks:
  verixa-tls-smoke:
    driver: bridge
