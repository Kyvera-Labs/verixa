packages:
  - "apps/*"
  - "packages/*"
  - "tests"
# Copies workspace dependencies' real files into node_modules instead of
# symlinking them — required for `pnpm deploy` (used to build the apps/api
# Docker image, Issue 012) to produce a self-contained, node_modules-portable
# bundle instead of one full of symlinks back into the monorepo.
injectWorkspacePackages: true
# Prisma's install scripts download the platform-specific query engine
# binaries it needs to run at all, and @prisma/client's postinstall runs
# `prisma generate`. Both are required for Prisma to function, so they're
# allowed here rather than left blocked (pnpm blocks all install scripts by
# default — a good default, since an install script is arbitrary code
# execution from a dependency; each entry here is a deliberate exception).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # Transitive deps of Testcontainers (Issues 047/405), all denied.
  # cpu-features and ssh2 matter only for Docker-over-SSH connections, and we
  # connect over the local socket; protobufjs's build step precompiles
  # definitions it also resolves fine at runtime. Recorded explicitly so
  # `pnpm install` doesn't stop to ask and the decision isn't re-litigated.
  cpu-features: false
  protobufjs: false
  ssh2: false
# Fail the install, instead of silently skipping the script, when a newly
# added dependency wants to run an install script that is not listed in
# allowBuilds above. A new script then has to be approved in review rather
# than going unnoticed.
strictDepBuilds: true

# Supply-chain guards for resolution: they apply whenever pnpm picks a
# version (`pnpm add`, `pnpm update`, Dependabot), not when installing from
# the existing lockfile.
#
# Refuse versions published less than 3 days (4320 minutes) ago. Most
# malicious releases of hijacked packages are found and pulled within that
# window. An urgent security fix younger than that can be let through by
# adding it to minimumReleaseAgeExclude for one pull request.
minimumReleaseAge: 4320
# Refuse transitive dependencies that come from a git repository or a
# tarball URL instead of the registry, where none of the checks here apply.
blockExoticSubdeps: true
# Refuse a version that has weaker publishing evidence than earlier ones,
# such as no provenance attestation after releases that had one. That is
# what a hijacked maintainer account publishing from its own machine looks
# like: eslint-config-prettier 9.1.1 (July 2025) was exactly that, and this
# setting blocks it.
trustPolicy: no-downgrade
# Reviewed 2026-11-18: each exact version below is the one already locked,
# its integrity hash matches the registry, and it was published by the
# package's long-standing maintainer without CI provenance. Exact versions
# only, so a later release that downgrades trust is still blocked.
trustPolicyExclude:
  # The clean re-release published by hand after the 9.1.1 compromise.
  - eslint-config-prettier@9.1.2
  - pino@9.14.0
  - undici-types@6.21.0
  - chokidar@4.0.3
# fast-uri is a transitive dependency (via fastify's ajv-compiler chain and
# commitlint's ajv chain), pulled in at vulnerable version ranges in some of
# those paths (GHSA-8jxf-...: host confusion via a backslash authority
# introducer). Neither is a direct dependency, so the fix has to be an
# override; pinning to a single known-patched version (rather than a
# range-conditional override per vulnerable range) is simpler and equally
# effective here since nothing in this repo depends on fast-uri's API
# directly across a major version boundary.
overrides:
  # Raised from >=4.1.2 to the first release that also fixes the percent-encoded
  # scheme, path-equivalence, WHATWG host and first-segment-colon advisories
  # (GHSA-w74x-v6f9-j3xg and three siblings).
  fast-uri: ">=4.2.3"
  # follow-redirects 1.16.0: array-form headers bypass cross-origin credential
  # stripping (GHSA-q3jh-wrc6-jgq8) and a sensitiveHeaders regex escaping flaw
  # (GHSA-8r9p-f939-6h3c); both fixed in 1.16.1. 1.16.1 itself then discards
  # cross-realm sensitiveHeaders arrays and lets custom credentials follow
  # redirects (GHSA-mrwp-f3q8-3g9p), fixed in 1.16.2. Transitive via
  # @stellar/stellar-sdk -> axios, so an override is the only lever.
  follow-redirects: ">=1.16.2"
  # nanoid <3.3.18: a custom generator with size 0 loops forever (GHSA,
  # high). Transitive via the vitest/postcss chain, so an override is the
  # only lever.
  # Constrained to the 3.x line, not a bare ">=": an unbounded override
  # resolved this to 6.x, and silently major-bumping a transitive dependency
  # to fix a patch-level CVE trades a known bug for an unknown one.
  nanoid: "^3.3.18"
  # qs <6.16.0: denial of service via an attacker-controlled isBuffer.
  # Transitive via the supertest/superagent chain used in integration tests.
  qs: ">=6.16.0"
  # axios <1.20.0: multiple SSRF advisories (absolute-URL base-URL bypass,
  # unenforced maxRedirects on the fetch adapter). Transitive via
  # @stellar/stellar-sdk, used by packages/audit, packages/stellar-anchor
  # and apps/api. Constrained to the 1.x line for the same reason as nanoid
  # above.
  axios: "^1.20.0"
  # deepmerge-ts <8.0.0: stack exhaustion merging recursive object graphs.
  # Transitive via prisma's own @prisma/config dependency (build-time CLI
  # tooling, not shipped to production), so an override is the only lever.
  deepmerge-ts: ">=8.0.0"
  # effect <=3.22.0: ReDoS in Schema.TemplateLiteral's compiled regex
  # (GHSA-7589-6fvf-x4pw, high), fixed in 3.22.1. Transitive via prisma's
  # @prisma/config, which pins effect exactly, so an override is the only
  # lever. Constrained to the 3.x line, same reasoning as nanoid above.
  effect: "^3.22.1"
  # vite <=6.4.2: server.fs.deny bypass via a Windows alternate-data-stream
  # path. Transitive via vitest's own vite dependency; vitest 3.2.6+ accepts
  # vite ^5 || ^6, and pnpm was resolving the ^5 branch, which this advisory
  # also covers. Constrained to the 6.x line, not a bare ">=": an unbounded
  # override resolved this to 8.x, same reasoning as nanoid above.
  # Raised to ^6.4.4 for GHSA-587h-7wmj-h5pm (launch-editor existence check
  # bypass on Windows, fixed in 6.4.4); dev server only.
  vite: "^6.4.4"
  # undici 8.11.2: DoS via unhandled error on excessive content-encodings
  # (GHSA-xjj6-f33q-929c), fixed in 8.12.2. Transitive via
  # @testcontainers/postgresql -> testcontainers, so test tooling only and an
  # override is the only lever. Constrained to the 8.x line it is already on.
  undici: "^8.12.2"
  # tinypool <2.1.2: prototype-pollution gadget in worker/run() options
  # leading to RCE (two advisories, both closed at 2.1.2). Transitive via
  # vitest's own worker-pool dependency.
  tinypool: "^2.1.2"
  # find-my-way <=9.6.0: denial of service over HTTP/2 (GHSA-c96f-x56v-gq3h,
  # high), fixed in 9.7.0. fastify already resolves a fixed 9.x; the old copy
  # is pinned by @prisma/dev, the prisma CLI's local dev-server tooling
  # (build-time only, stripped from the image), so an override is the only
  # lever. Constrained to the 9.x line, same reasoning as nanoid above.
  find-my-way: "^9.7.0"
  # mysql2 <3.22.0: auth-plugin downgrade leaks plaintext credentials
  # (GHSA-3f6p-5ww8-9rcr, high), fixed in 3.22.0. Pinned exactly by the
  # prisma 7 CLI for MySQL support; this repo only talks to Postgres, so the
  # code never runs, but the audit gate rightly counts it. Constrained to 3.x.
  mysql2: "^3.22.0"
